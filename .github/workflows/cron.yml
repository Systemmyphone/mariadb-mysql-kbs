name: Run sudo-bot to update files

permissions:
  contents: read

env:
    NODE_VERSION: 22
    RUST_TOOLCHAIN: stable

on:
    repository_dispatch:
        types: run-cron
    workflow_dispatch:
    schedule:
        - cron: "30 13 * * 6"

jobs:
    run-sudo-bot-cron:
        environment:
            name: sudo-bot
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
            - name: Get yarn cache directory path
              id: yarn-cache-dir-path
              run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT
            - name: yarn cache
              uses: actions/cache@v5
              with:
                  path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
                  key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-
            - name: composer cache module
              uses: actions/cache@v5
              with:
                  path: ~/.composer/cache/
                  key: composer-cache
            - name: Set up toolchain
              uses: FrancisRussell/ferrous-actions@v0.1.0-beta.2
              with:
                  command: install-rustup
                  profile: minimal
                  toolchain: ${{ env.RUST_TOOLCHAIN }}
                  default: true
            # Build and install the binary from the current sources (not from
            # crates.io) so the cron uses the unreleased extraction code. This
            # avoids having to publish a release before the new code can be
            # exercised by the update-PR workflow.
            - name: Install mariadb-mysql-kbs from source
              run: cargo install --path .
            - name: Install
              run: |
                  yarn install
                  composer install --no-interaction
            - name: Build
              run: |
                  mariadb-mysql-kbs extract
                  composer run build
            - name: Install sudo-bot
              run: yarn global add sudo-bot
            - name: Run sudo-bot
              env:
                INSTALLATION_ID: ${{ secrets.INSTALLATION_ID }}
                GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
                GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
                GH_APP_JWT_PRIV_PEM_CONTENTS: ${{ secrets.GH_APP_JWT_PRIV_PEM_CONTENTS }}
                TARGET_BRANCH: "main"
                SKIP_DOCS_STEPS: "yes"
                TEMPLATE_FILE: "template.js"
              run: ./scripts/sudo-bot/create-pr.sh
            - name: Run test
              run: |
                  yarn run test
                  composer run test
