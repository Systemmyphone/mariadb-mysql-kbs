name: Build and test rust code

on:
    workflow_dispatch:
    pull_request:
        paths:
            - ".github/workflows/rust.yml"
            - "src/rust/**"
            - "Cargo.toml"
            - "Cargo.lock"
    push:
        paths:
            - ".github/workflows/rust.yml"
            - "src/rust/**"
            - "Cargo.toml"
            - "Cargo.lock"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build_and_test:
        runs-on: ubuntu-latest
        name: Build and test
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
            - name: Set up toolchain
              uses: FrancisRussell/ferrous-actions@v0.1.0-beta.2
              with:
                  command: install-rustup
                  profile: minimal
                  toolchain: stable
                  # LLVM tools is for coverage
                  components: llvm-tools
                  default: true
            - name: Build
              uses: FrancisRussell/ferrous-actions@v0.1.0-beta.2
              with:
                  command: cargo build
                  toolchain: stable
                  args: --release
              env:
                  CARGO_INCREMENTAL: "0"
                  RUSTFLAGS: "-Cinstrument-coverage"
                  RUSTDOCFLAGS: "-Cinstrument-coverage"
            - name: Test
              uses: FrancisRussell/ferrous-actions@v0.1.0-beta.2
              with:
                  command: cargo test
                  toolchain: stable
                  args: --all-features --no-fail-fast
              env:
                  CARGO_INCREMENTAL: "0"
                  RUSTFLAGS: "-Cinstrument-coverage"
                  RUSTDOCFLAGS: "-Cinstrument-coverage"
            - name: Install grcov
              run: |
                mkdir -p "${HOME}/.local/bin"
                curl -sL https://github.com/mozilla/grcov/releases/download/v0.10.5/grcov-x86_64-unknown-linux-gnu.tar.bz2 | tar jxf - -C "${HOME}/.local/bin"
                echo "$HOME/.local/bin" >> $GITHUB_PATH
            - name: Run grcov
              run: grcov . --binary-path target/debug/deps/ -s . -t lcov --branch --ignore-not-existing --ignore '../**' --ignore '/*' -o coverage.lcov
            - uses: codecov/codecov-action@v5
              with:
                  files: ./coverage.lcov
                  flags: rust
                  fail_ci_if_error: true # optional (default = false)
                  token: ${{ secrets.CODECOV_TOKEN }}
