name: Build and test rust code

on:
    workflow_dispatch:
    pull_request:
        paths:
            - ".github/workflows/rust.yml"
            - "src/rust/**"
            - "Cargo.toml"
            - "Cargo.lock"
    push:
        paths:
            - ".github/workflows/rust.yml"
            - "src/rust/**"
            - "Cargo.toml"
            - "Cargo.lock"

permissions:
    contents: read

env:
    GRCOV_VERSION: "0.10.5"
    # Pin the toolchain so a new stable's clippy lints cannot break CI
    # unexpectedly (bump deliberately). Must stay >= the Cargo.toml MSRV.
    RUST_VERSION: "1.95.0"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build_and_test:
        runs-on: ubuntu-latest
        name: Build and test
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: ${{ env.RUST_VERSION }}
                  # llvm-tools is for coverage
                  components: clippy, rustfmt, llvm-tools
            - name: Cache cargo artifacts
              uses: Swatinem/rust-cache@v2
            - name: Check formatting
              run: cargo fmt --all -- --check
            - name: Clippy
              # Lint levels come from Cargo.toml [lints]: clippy `all` and
              # unsafe_code are denied (fail CI); pedantic/nursery stay warnings.
              run: cargo clippy --all-targets --all-features
            - name: Build
              run: cargo build --release
              env:
                  CARGO_INCREMENTAL: "0"
                  RUSTFLAGS: "-Cinstrument-coverage"
                  RUSTDOCFLAGS: "-Cinstrument-coverage"
            - name: Test
              run: cargo test --all-features --no-fail-fast
              env:
                  CARGO_INCREMENTAL: "0"
                  RUSTFLAGS: "-Cinstrument-coverage"
                  RUSTDOCFLAGS: "-Cinstrument-coverage"
            - name: Install grcov
              run: |
                mkdir -p "${HOME}/.local/bin"
                curl -sL https://github.com/mozilla/grcov/releases/download/v${{ env.GRCOV_VERSION }}/grcov-x86_64-unknown-linux-gnu.tar.bz2 | tar jxf - -C "${HOME}/.local/bin"
                echo "$HOME/.local/bin" >> $GITHUB_PATH
            - name: Run grcov
              run: grcov . --binary-path target/debug/deps/ -s . -t lcov --branch --ignore-not-existing --ignore '../**' --ignore '/*' -o coverage.lcov
            - uses: codecov/codecov-action@v5
              with:
                  files: ./coverage.lcov
                  flags: rust
                  fail_ci_if_error: true # optional (default = false)
                  token: ${{ secrets.CODECOV_TOKEN }}
