[package]
name = "mariadb-mysql-kbs"
version = "1.3.1-rc2"
authors = ["William Desportes <williamdes@wdes.fr>"]
edition = "2021"
rust-version = "1.92"  # MSRV
description = "An index of the MariaDB and MySQL Knowledge bases"
homepage = "https://github.com/williamdes/mariadb-mysql-kbs/tree/v1.3.0#readme"
repository = "https://github.com/williamdes/mariadb-mysql-kbs"
readme = "README.md"
keywords = ["mariadb", "mysql", "dataset", "kb", "knowledge-base"]
categories = ["command-line-utilities"]
license = "MPL-2.0"
include = [
    "/src/rust/**/*.rs",
    "/dist/*.json",
    "/dist/*.md",
    "/data/*.json",
    "/Cargo.toml",
    "/LICENSE",
]

[badges]
github = { repository = "mariadb-mysql-kbs", branch = "main" }
codecov = { repository = "mariadb-mysql-kbs", branch = "main", service = "github" }
is-it-maintained-issue-resolution = { repository = "mariadb-mysql-kbs" }
is-it-maintained-open-issues = { repository = "mariadb-mysql-kbs" }
maintenance = { status = "passively-maintained" }

[lib]
name = "mariadb_mysql_kbs"
path = "src/rust/lib.rs"
test = true
doctest = true
bench = true
doc = true

[[bin]]
name = "mariadb-mysql-kbs"
path = "src/rust/mariadb-mysql-kbs.rs"

[dependencies]
clap = { version = "4.5.53", features = ["cargo", "derive"] }
futures = "0.3.31"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
regex = "1.12.2"
ureq = { version = "3.1.4" }
select = "0.6.1"
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }
serde_repr = "0.1.20"

[dev-dependencies]
pretty_assertions = "1.4.1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# This is a data-extraction CLI: panicking on malformed scraped input is an
# acceptable failure mode, so unwrap/expect stay allowed (unlike tab-atelier).
unwrap_used = "allow"
expect_used = "allow"
# Documentation lints that do not fit an internal tool
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
# The per-source extractors are inherently long match functions
too_many_lines = "allow"
# Opinionated nursery lint: a match on Option reads clearer than map_or_else here
option_if_let_else = "allow"
